name: Apple PlainTalk
description: Apple PlainTalk is a speech synthesis system bundled with Mac OS X,
  first released in 1984. It provides text-to-speech capabilities for Macintosh
  systems with support for English (United States) and 15+ voices. Latest stable
  version released in 2018.
