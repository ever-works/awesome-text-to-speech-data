name: LocalSoundsAPI
description: LocalSoundsAPI is a portable offline audio studio for Windows with
  a Web UI and local REST API. It bundles XTTS v2, Fish Speech, and Kokoro TTS
  with voice cloning, Whisper verification, Stable Audio, and ACE-Step
  music/SFX, with per-model CPU/GPU selection. No install; MIT licensed.
