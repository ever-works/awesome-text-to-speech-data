  - Apache-2.0
markdown: >-
  ## Overview


  loudkit provides on-device TTS with native SDKs, 28 voices in 10 languages,
  voice cloning from ~10s of audio, and a local server with an OpenAI-compatible
  speech endpoint.


  ## License


  Apache-2.0


  ## Deployment


  Self-hosted, on-device, local server


  ## Repository


  https://github.com/loudreader/loudkit
