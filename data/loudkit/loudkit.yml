name: loudkit
description: loudkit is on-device TTS with native SDKs, offering 28 voices in 10
  languages and voice cloning from about 10 seconds of audio. It includes a
  local server with an OpenAI-compatible speech endpoint and supports PyTorch,
  ONNX Runtime, and CoreML backends. Apache-2.0 licensed, derived from
  Chatterbox.
source_url: https://github.com/loudreader/loudkit
category: Open-Source TTS Models
