markdown: >-
  ## Overview


  VoiceText is a proprietary text-to-speech system developed by ReadSpeaker
  (formerly NeoSpeech).


  ## Technical Details


  - **First public release date**: 2002

  - **Latest stable version**: 2017

  - **License**: Proprietary

  - **Available languages**: English (US), English (British), American Spanish,
  Canadian French, Chinese Mandarin, Japanese, Korean

  - **Available voices**: 13

  - **Programming language**: C/C++/Java

  - **Operating system(s)**: Windows, Linux


  ## Technical Voice Details


  - SSML support: Yes

  - SAPI version: 5.x
