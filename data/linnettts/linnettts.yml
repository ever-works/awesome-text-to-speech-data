markdown: >-
  ## Overview


  LinnetTTS is a 41M-parameter on-device English TTS with voice cloning from a
  few seconds of audio, using a Rust runtime with no PyTorch at inference.


  ## License


  Apache-2.0 code; Linnet Weights License for weights (free for commercial use
  in products)


  ## Deployment


  Self-hosted, on-device


  ## Repository


  https://github.com/VoxRT/LinnetTTS
