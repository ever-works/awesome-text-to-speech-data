name: LinnetTTS
description: LinnetTTS is a 41M-parameter on-device English TTS with voice
  cloning from a few seconds of audio. It uses a Rust runtime (no PyTorch at
  inference), 83 MB fp16 weights, and 80 ms streaming step. Apache-2.0 code with
  Linnet Weights License for weights.
source_url: https://github.com/VoxRT/LinnetTTS
