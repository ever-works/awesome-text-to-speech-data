markdown: >-
  ## Overview


  CereProc is a proprietary text-to-speech system developed by CereProc.


  ## Technical Details


  - **First public release date**: 2006

  - **Latest stable version**: 2017, February

  - **License**: Proprietary

  - **Available languages**: English (British), English (US), English
  (Scottish), English (Irish), French, French (Canadian), German, Austrian
  German, Italian, Irish, Spanish (Castilian), Spanish (Latin American), Dutch,
  Polish, Portuguese, Portuguese (Brazilian), Japanese, Catalan, Scottish
  Gaelic, Swedish, Russian, Mandarin

  - **Available voices**: 46

  - **Programming language**: Java / C, C++ / Objective C / Python / C# & .Net
  through SAPI

  - **Operating system(s)**: Linux, Windows, Mac OS X, Embedded Linux, Android,
  iOS, Cloud service


  ## Technical Voice Details


  - SSML support: Yes

  - SAPI version: 5.x

  - WS support: Yes

  - PLS support: Yes

  - CLI support: Yes
