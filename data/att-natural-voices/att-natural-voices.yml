markdown: >-
  ## Overview


  AT&T Natural Voices is a proprietary text-to-speech system developed by AT&T
  Labs.


  ## Technical Details


  - **First public release date**: Unknown

  - **Latest stable version**: 2008

  - **License**: Proprietary

  - **Available languages**: English (British), English (Indian), English (US),
  French, French (Canadian), German, Italian, Spanish (Latin American)

  - **Available voices**: 20

  - **Programming language**: C++

  - **Operating system(s)**: Linux, Windows


  ## Technical Voice Details


  - SSML support: Yes

  - SAPI version: 5.1
