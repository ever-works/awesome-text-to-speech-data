name: VoiceCraft
description: VoiceCraft is a token-infilling neural codec model for zero-shot
  speech editing and TTS synthesis. It enables precise in-audio speech editing
  and zero-shot voice cloning, implemented in Python/PyTorch.
source_url: https://github.com/jasonppy/VoiceCraft
