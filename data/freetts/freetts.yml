  ## Overview

  FreeTTS is an open-source text-to-speech system written in Java.

  ## Technical Details

  - **First public release date**: 2001, December 14
  - **Latest stable version**: 2009, March 9
  - **License**: BSD
  - **Available languages**: English...
  - **Available voices**: Several
  - **Programming language**: Java
  - **Operating system(s)**: Cross-platform

  ## Creators

  Paul Lamere, Philip Kwok, Dirk Schnelle-Walka, Willie Walker and others
