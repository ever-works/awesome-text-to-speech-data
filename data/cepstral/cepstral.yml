markdown: >-
  ## Overview


  Cepstral is a proprietary text-to-speech system developed by Cepstral LLC.


  ## Technical Details


  - **First public release date**: 2000

  - **Latest stable version**: 2013

  - **License**: Proprietary

  - **Available languages**: English (British), English (US), Italian, French
  (Canadian), German, Spanish (American), ...

  - **Available voices**: 25+

  - **Programming language**: C/C++

  - **Operating system(s)**: Mac OS X, Windows, i386-Linux, x86-64-Linux,
  Sparc-Solaris, i386-Solaris


  ## Technical Voice Details


  - SSML support: Yes

  - SAPI version: 5.x

  - WS support: Yes

  - PLS support: Yes

  - CLI support: Yes
