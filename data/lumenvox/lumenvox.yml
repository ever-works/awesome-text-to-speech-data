markdown: >-
  ## Overview


  LumenVox is a proprietary text-to-speech system developed by LumenVox.


  ## Technical Details


  - **First public release date**: 2011

  - **Latest stable version**: 2019

  - **License**: Proprietary

  - **Available languages**: Danish, Dutch, English (Australian), English (US),
  English (UK), English (Welsh), English (Indian), French, French (Canadian),
  German, Icelandic, Italian, Polish, Portuguese, Portuguese (Brazilian),
  Romanian, Russian, Spanish (North American), Spanish (Latin American), Spanish
  (Castilian), Swedish, Turkish, Welsh, Welsh English

  - **Available voices**: 57

  - **Programming language**: C/C++

  - **Operating system(s)**: Windows, Linux


  ## Technical Voice Details


  - SSML support: Yes

  - SAPI version: 5.x

  - WS support: Yes

  - PLS support: Yes

  - CLI support: Yes
