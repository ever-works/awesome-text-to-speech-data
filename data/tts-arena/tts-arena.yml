markdown: >-
  ## Overview


  TTS Arena is a community-driven leaderboard operated by Artificial Analysis
  that evaluates text-to-speech models through blind A/B testing. Users compare
  model outputs side by side to rank naturalness and quality across different
  TTS systems.


  ## Features


  - Blind A/B testing of TTS model outputs

  - Community-driven rankings and leaderboards

  - Comparative quality scores across multiple models

  - Regular updates with new model submissions


  ## Pricing


  Free to use for browsing and participating in benchmarks.
