markdown: >-
  ## Overview


  Coqui TTS is an open-source text-to-speech library supporting 1100+ languages,
  zero-shot voice cloning, and fine-tuning. Originally developed by Coqui AI, it
  is now community-maintained after the company shut down in late 2023.


  ## License


  Community-maintained (originally under Coqui AI)


  ## Deployment


  Self-hosted, local


  ## Repository


  https://github.com/idiap/coqui-ai-TTS
