  - Apache-2.0
markdown: >-
  ## Overview


  gpu-duet runs a local LLM plus voice-cloning TTS on a single 8 GB GPU, using
  Qwen3-TTS 1.7B on a patched C++ engine alongside llama.cpp.


  ## License


  Apache-2.0


  ## Deployment


  Self-hosted, local HTTP service


  ## Repository


  https://github.com/korexil/gpu-duet
