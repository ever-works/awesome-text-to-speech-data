name: gpu-duet
description: gpu-duet runs local LLM + voice-cloning TTS on one 8 GB GPU. It
  runs Qwen3-TTS 1.7B on a patched C++ engine next to a llama.cpp LLM, with the
  LLM pausing after each sentence until TTS synthesis completes. Apache-2.0
  licensed.
source_url: https://github.com/korexil/gpu-duet
category: Open-Source TTS Models
tags:
