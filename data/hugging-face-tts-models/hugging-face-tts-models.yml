markdown: >-
  ## Overview


  Hugging Face hosts a large collection of pretrained Text-to-Speech models
  available through the Hugging Face Hub. Models can be browsed, downloaded, and
  used for inference via the Transformers library or the Hugging Face Inference
  API.


  ## Features


  - Thousands of pretrained TTS models from the community and research labs

  - Model cards with usage examples and inference code

  - Support for multiple languages and speaker styles

  - Integration with the Transformers library and Inference API

  - Community discussions and model reviews


  ## Pricing


  Free to browse and download models. Some models may have usage restrictions
  based on their individual licenses. Inference via Hugging Face Inference API
  may have associated costs depending on usage tier.
